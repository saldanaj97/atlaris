version: 2.1

parameters:
  base_ref:
    type: string
    default: develop
  integration_workers:
    type: enum
    enum: ['2', '4']
    default: '4'
  test_db_debug:
    type: boolean
    default: false

orbs:
  node: circleci/node@7

executors:
  node:
    docker:
      - image: cimg/node:24.19
    resource_class: large
  ubuntu:
    machine:
      image: ubuntu-2404:current
    resource_class: large

commands:
  init-env:
    steps:
      - run:
          name: Set pipeline env
          command: |
            EVENT_NAME="<< pipeline.event.name >>"
            BRANCH="<< pipeline.git.branch >>"
            BASE_REF="<< pipeline.parameters.base_ref >>"
            PR_BASE="<< pipeline.event.github.pull_request.base.ref >>"
            if [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${PR_BASE}" ]; then
              BASE_REF="${PR_BASE}"
            elif [ "${EVENT_NAME}" = "pull_request" ] && [ "${BRANCH}" = "develop" ]; then
              BASE_REF="main"
            fi
            echo "export BASE_REF=\"${BASE_REF}\"" >> "$BASH_ENV"
            echo 'export INTEGRATION_MAX_WORKERS="<< pipeline.parameters.integration_workers >>"' >> "$BASH_ENV"
            echo 'export TEST_DB_DEBUG="<< pipeline.parameters.test_db_debug >>"' >> "$BASH_ENV"

  fetch-base:
    steps:
      - run:
          name: Fetch base ref for diffs
          command: |
            git fetch --unshallow || true
            git fetch --no-tags origin "${BASE_REF}" || true

  # Halt integration-only jobs before checkout when their paths did not change.
  # Dynamic setup keeps docs-only pipelines from provisioning these executors.
  # PRs into main (the develop promotion) always run the full job.
  skip-unless-integration:
    steps:
      - attach_workspace:
          at: /tmp/.ci-flags
      - run:
          name: Skip if no integration-path changes
          command: |
            if [ "<< pipeline.event.github.pull_request.base.ref >>" = "main" ]; then
              echo "PR into main; running in full."
            elif [ "$(cat /tmp/.ci-flags/integration 2>/dev/null || echo true)" != "true" ]; then
              echo "No integration-path changes; skipping."
              circleci-agent step halt
            fi

  # Halt the build job before checkout when no build input changed. The `build`
  # flag (see detect-changes) covers source, root configs, package.json, the
  # lockfile and .circleci/, so a CI-only PR still exercises the job.
  # PRs into main always build.
  skip-unless-build-inputs:
    steps:
      - attach_workspace:
          at: /tmp/.ci-flags
      - run:
          name: Skip if no build-input changes
          command: |
            if [ "<< pipeline.event.github.pull_request.base.ref >>" = "main" ]; then
              echo "PR into main; running in full."
            elif [ "$(cat /tmp/.ci-flags/build 2>/dev/null || echo true)" != "true" ]; then
              echo "No build-input changes; skipping."
              circleci-agent step halt
            fi

  # Restore-only: the pnpm store cache is saved by warm-pnpm-cache on trunk,
  # so PR and parallel jobs never upload their own copy.
  install-pnpm-deps:
    steps:
      - node/install-pnpm:
          version: '11.9.0'
      - restore_cache:
          keys:
            - pnpm-store-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-store-v1-{{ arch }}-
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile --prefer-offline --store-dir ~/.pnpm-store

  install-node-and-deps:
    steps:
      - node/install:
          node-version: '24.19.0'
          install-pnpm: true
          pnpm-version: '11.9.0'
      - node/install-packages:
          pkg-manager: pnpm

  summarize-vitest:
    parameters:
      results-file:
        type: string
    steps:
      - run:
          name: Test summary
          when: always
          command: |
            file="<< parameters.results-file >>"
            if [ ! -f "${file}" ]; then
              echo "No ${file}"
              exit 0
            fi
            TOTAL=$(jq -r '.numTotalTests // 0' "${file}" 2>/dev/null || echo 0)
            PASSED=$(jq -r '.numPassedTests // 0' "${file}" 2>/dev/null || echo 0)
            FAILED=$(jq -r '.numFailedTests // 0' "${file}" 2>/dev/null || echo 0)
            SKIPPED=$(jq -r '.numPendingTests // 0' "${file}" 2>/dev/null || echo 0)
            echo "passed=${PASSED} failed=${FAILED} skipped=${SKIPPED} total=${TOTAL}"

  store-test-outputs:
    parameters:
      results-file:
        type: string
      coverage-destination:
        type: string
        default: ''
    steps:
      - summarize-vitest:
          results-file: << parameters.results-file >>
      - run:
          name: Ensure test artifact dirs
          when: always
          command: mkdir -p test-results coverage
      - store_test_results:
          path: test-results
          when: always
      - when:
          condition: << parameters.coverage-destination >>
          steps:
            - store_artifacts:
                path: coverage
                destination: << parameters.coverage-destination >>
                when: always

jobs:
  # Sole writer of the pnpm store cache. Exact-key restore only, so a miss
  # fetches a clean store for the current lockfile instead of growing an old one.
  warm-pnpm-cache:
    executor: node
    resource_class: medium
    retention:
      caches: 7d
    steps:
      - checkout
      - node/install-pnpm:
          version: '11.9.0'
      - restore_cache:
          keys:
            - pnpm-store-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Fetch lockfile packages into store
          command: pnpm fetch --frozen-lockfile --store-dir ~/.pnpm-store
      - save_cache:
          key: pnpm-store-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store

  detect-changes:
    executor: node
    resource_class: small
    steps:
      - checkout
      - init-env
      - fetch-base
      - run:
          name: Detect source vs integration changes
          command: |
            mkdir -p .ci-flags
            echo true > .ci-flags/source
            echo true > .ci-flags/integration
            echo true > .ci-flags/remediation
            echo true > .ci-flags/build

            event_name="<< pipeline.event.name >>"
            base_rev="<< pipeline.git.base_revision >>"
            if [ "${event_name}" = "pull_request" ]; then
              if ! git rev-parse --verify "origin/${BASE_REF}" >/dev/null 2>&1; then
                echo "origin/${BASE_REF} missing; assuming source and integration changed."
                echo "source=true integration=true"
                exit 0
              fi
              diff_range="origin/${BASE_REF}...HEAD"
            elif [ "${CIRCLE_BRANCH}" = "main" ] || [ "${CIRCLE_BRANCH}" = "develop" ]; then
              if [ -z "${base_rev}" ]; then
                echo "No pipeline.git.base_revision; assuming source and integration changed."
                echo "source=true integration=true"
                exit 0
              fi
              diff_range="${base_rev}...HEAD"
            elif ! git rev-parse --verify "origin/${BASE_REF}" >/dev/null 2>&1; then
              echo "origin/${BASE_REF} missing; assuming source and integration changed."
              echo "source=true integration=true"
              exit 0
            else
              diff_range="origin/${BASE_REF}...HEAD"
            fi

            echo "Diff range: ${diff_range}"
            source=false
            integration=false
            remediation=false
            build=false
            changed_files="$(mktemp)"
            if ! git diff --name-only "${diff_range}" > "${changed_files}"; then
              echo "git diff failed; assuming source and integration changed."
              source=true
              integration=true
              remediation=true
              build=true
            else
              while IFS= read -r f; do
                [ -z "${f}" ] && continue
                case "${f}" in
                  src/*|supabase/*|public/*)
                    source=true
                    integration=true
                    ;;
                  tests/integration/*|tests/security/*|tests/helpers/*|tests/setup/*)
                    source=true
                    integration=true
                    ;;
                  tests/*|scripts/*)
                    source=true
                    ;;
                  *.config.ts|*.config.js|*.config.mjs|*.config.cjs|tsconfig.json|package.json|pnpm-workspace.yaml|pnpm-lock.yaml|next-env.d.ts|middleware.ts)
                    integration=true
                    ;;
                esac
                case "${f}" in
                  .github/scripts/*|.github/workflows/dependency-security-remediation.yml|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.circleci/*)
                    remediation=true
                    ;;
                esac
                case "${f}" in
                  .circleci/*)
                    build=true
                    ;;
                esac
              done < "${changed_files}"
              if [ "${source}" = "true" ] || [ "${integration}" = "true" ]; then
                build=true
              fi
            fi
            rm -f "${changed_files}"

            echo "${source}" > .ci-flags/source
            echo "${integration}" > .ci-flags/integration
            echo "${remediation}" > .ci-flags/remediation
            echo "${build}" > .ci-flags/build
            echo "source=${source} integration=${integration} remediation=${remediation} build=${build}"
      - persist_to_workspace:
          root: .ci-flags
          paths:
            - source
            - integration
            - remediation
            - build

  lint-and-type-check:
    executor: node
    steps:
      - checkout
      - init-env
      - install-pnpm-deps
      - attach_workspace:
          at: /tmp/.ci-flags
      - run:
          name: Lint and type check
          no_output_timeout: 5m
          command: |
            lint_command="pnpm lint"
            if [ "$(cat /tmp/.ci-flags/source 2>/dev/null || echo true)" = "true" ]; then
              lint_command="pnpm lint --format=github"
            fi
            pnpm exec concurrently \
              --kill-others-on-fail \
              --names lint,type \
              --prefix-colors blue,magenta \
              "$lint_command" \
              "pnpm typecheck"
      - run:
          name: Worker bundle gate
          no_output_timeout: 5m
          command: |
            pnpm workers check
            pnpm workers types
            if ! git diff --exit-code -- workers/jobs/.cloudflare/types/index.d.ts; then
              echo "workers/jobs/.cloudflare/types/index.d.ts is stale. Run 'pnpm workers types' and commit the file."
              exit 1
            fi

  # Next.js build gate for PRs (Vercel builds only develop, hotfix/* and main). Needs no
  # secrets. The empty Sentry token overrides any project-level value, so
  # withSentryConfig skips release creation and source-map upload.
  build:
    executor: node
    environment:
      SENTRY_AUTH_TOKEN: ''
    steps:
      - skip-unless-build-inputs
      - checkout
      - init-env
      - install-pnpm-deps
      - run:
          name: Build
          no_output_timeout: 15m
          command: pnpm build

  vulnerability-scan:
    executor: node
    resource_class: small
    steps:
      - checkout
      - init-env
      - node/install-pnpm:
          version: '11.9.0'
      - run:
          name: pnpm audit (prod, high+)
          no_output_timeout: 8m
          command: |
            MAX_ATTEMPTS=3
            RETRY_DELAY_SECONDS=5
            AUDIT_TIMEOUT_SECONDS=30

            is_registry_outage_error() {
              local output="$1"
              if echo "${output}" | grep -Eiq '(^|[^0-9])429([^0-9]|$)|Too Many Requests'; then
                return 1
              fi
              echo "${output}" | grep -Eiq 'ERR_PNPM_AUDIT_BAD_RESPONSE|ERR_PNPM_FETCH_[45][0-9]{2}|ERR_PNPM_META_FETCH_FAIL|ECONNRESET|ETIMEDOUT|ENOTFOUND|EAI_AGAIN|ECONNREFUSED|EHOSTUNREACH|socket hang up|fetch failed|status code 5[0-9][0-9]|Internal Server Error|npm/v1/security/audits|registry\.npmjs\.org'
            }

            has_vulnerability_findings() {
              local output="$1"
              echo "${output}" | grep -Eiq 'vulnerabilities found|Severity:[[:space:]]*(high|critical)|GHSA-|CVE-'
            }

            for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
              echo "Audit attempt ${attempt}/${MAX_ATTEMPTS} (timeout: ${AUDIT_TIMEOUT_SECONDS}s)..."
              set +e
              AUDIT_OUTPUT=$(timeout "${AUDIT_TIMEOUT_SECONDS}"s pnpm audit --prod --audit-level=high 2>&1)
              EXIT_CODE=$?
              set -e

              if [ "${EXIT_CODE}" -eq 0 ]; then
                echo "Audit passed."
                exit 0
              fi

              echo "${AUDIT_OUTPUT}"

              if has_vulnerability_findings "${AUDIT_OUTPUT}"; then
                echo "Real vulnerabilities detected; failing immediately."
                exit 1
              fi

              if [ "${EXIT_CODE}" -eq 124 ] || is_registry_outage_error "${AUDIT_OUTPUT}"; then
                if [ "${attempt}" -lt "${MAX_ATTEMPTS}" ]; then
                  echo "Transient registry issue; retrying in ${RETRY_DELAY_SECONDS}s..."
                  sleep "${RETRY_DELAY_SECONDS}"
                fi
              else
                echo "Audit failed for a non-transient reason; failing immediately."
                exit 1
              fi
            done

            echo "Audit failed after ${MAX_ATTEMPTS} attempts due to transient registry errors; failing closed."
            exit 1

  unit-tests:
    executor: node
    environment:
      NODE_ENV: test
      SKIP_DB_TEST_SETUP: 'true'
    steps:
      - checkout
      - init-env
      - fetch-base
      - install-pnpm-deps
      - run:
          name: Unit tests
          no_output_timeout: 20m
          command: |
            mkdir -p test-results/unit
            if [ "${BASE_REF}" = "main" ]; then
              circleci testsuite run "unit tests" --analyze-tests=none --run-tests=all
            else
              circleci testsuite run "unit tests" --analyze-tests=none --run-tests=impacted
            fi
      - store-test-outputs:
          results-file: test-results/unit/results.json

  unit-impact-analysis:
    executor: node
    environment:
      NODE_ENV: test
      SKIP_DB_TEST_SETUP: 'true'
    steps:
      - checkout
      - install-pnpm-deps
      - run:
          name: Refresh unit test impact data
          no_output_timeout: 20m
          command: circleci testsuite run "unit tests" --analyze-tests=impacted --run-tests=none

  # develop only: PRs run impacted unit tests, so run the whole suite after merge
  # to surface impact-selection misses before the develop -> main promotion.
  # Separate from unit-impact-analysis so a test failure cannot block the impact refresh.
  unit-tests-trunk:
    executor: node
    environment:
      NODE_ENV: test
      SKIP_DB_TEST_SETUP: 'true'
    steps:
      - checkout
      - install-pnpm-deps
      - run:
          name: Unit tests (full suite)
          no_output_timeout: 20m
          command: |
            mkdir -p test-results/unit
            circleci testsuite run "unit tests" --analyze-tests=none --run-tests=all
      - store-test-outputs:
          results-file: test-results/unit/results.json

  integration-light:
    docker:
      - image: cimg/node:24.19
      - image: postgres:17-alpine
        environment:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
    resource_class: large
    environment:
      NODE_ENV: test
      SKIP_TESTCONTAINERS: 'true'
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - checkout
      - init-env
      - fetch-base
      - install-pnpm-deps
      - run:
          name: Wait for PostgreSQL
          command: |
            pnpm exec tsx --eval "
              import {
                resolveExternalPostgresUrl,
                waitForPostgres,
              } from './tests/setup/testcontainers.ts'
              waitForPostgres(resolveExternalPostgresUrl()).catch((error) => {
                console.error(error)
                process.exit(1)
              })
            "
      - run:
          name: Integration tests (impacted)
          no_output_timeout: 20m
          command: |
            mkdir -p test-results/integration
            if [ "${BASE_REF}" = "main" ]; then
              circleci testsuite run "integration tests" --analyze-tests=none --run-tests=all
            else
              circleci testsuite run "integration tests" --analyze-tests=none --run-tests=impacted
            fi
      - summarize-vitest:
          results-file: test-results/integration/results.json

  security-tests:
    docker:
      - image: cimg/node:24.19
      - image: postgres:17-alpine
        environment:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
    resource_class: medium
    parameters:
      skip_unless:
        type: enum
        enum: ['always', 'integration']
        default: always
    environment:
      NODE_ENV: test
      ALLOW_DB_TRUNCATE: 'true'
      SKIP_TESTCONTAINERS: 'true'
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - when:
          condition:
            equal: [integration, << parameters.skip_unless >>]
          steps:
            - skip-unless-integration
      - checkout
      - init-env
      - install-pnpm-deps
      - run:
          name: Wait for PostgreSQL
          command: |
            pnpm exec tsx --eval "
              import {
                resolveExternalPostgresUrl,
                waitForPostgres,
              } from './tests/setup/testcontainers.ts'
              waitForPostgres(resolveExternalPostgresUrl()).catch((error) => {
                console.error(error)
                process.exit(1)
              })
            "
      - run:
          name: RLS security tests
          no_output_timeout: 15m
          command: |
            mkdir -p test-results/security
            pnpm vitest run --project security tests/security/ \
              --reporter=default \
              --reporter=json \
              --reporter=junit \
              --outputFile.json=test-results/security/results.json \
              --outputFile.junit=test-results/security/junit.xml
      - store-test-outputs:
          results-file: test-results/security/results.json

  integration-tests:
    docker:
      - image: cimg/node:24.19
      - image: postgres:17-alpine
        environment:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
    resource_class: large
    # Fallback only: experimental.dynamic-parallelism (end of file) sizes this
    # job from list-integration-tests; CircleCI uses this value when it cannot.
    parallelism: 2
    environment:
      NODE_ENV: test
      ENABLE_CURATION: 'false'
      SKIP_TESTCONTAINERS: 'true'
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - skip-unless-integration
      - checkout
      - init-env
      - fetch-base
      - install-pnpm-deps
      - run:
          name: Wait for PostgreSQL
          command: |
            pnpm exec tsx --eval "
              import {
                resolveExternalPostgresUrl,
                waitForPostgres,
              } from './tests/setup/testcontainers.ts'
              waitForPostgres(resolveExternalPostgresUrl()).catch((error) => {
                console.error(error)
                process.exit(1)
              })
            "
      - run:
          name: Integration tests
          no_output_timeout: 25m
          # develop only: PRs into main already ran the full suite via integration-light.
          command: |
            mkdir -p test-results/integration
            circleci testsuite run "integration tests" --analyze-tests=none --run-tests=impacted
      - summarize-vitest:
          results-file: test-results/integration/results.json

  # Dynamic parallelism trial (measures its test-unit cost). Lists the atoms
  # integration-tests would run, without running them, so CircleCI can size
  # that job's parallelism. `discover` only lists files, so no database.
  list-integration-tests:
    executor: node
    resource_class: small
    environment:
      NODE_ENV: test
    steps:
      - skip-unless-integration
      - checkout
      - init-env
      - fetch-base
      - install-pnpm-deps
      - run:
          name: List selected integration tests
          # Same selection flags as integration-tests so the two agree.
          command: >-
            circleci testsuite list-tests "integration tests"
            --key=atlaris-integration-parallelism
            --analyze-tests=none --run-tests=impacted

  integration-impact-analysis:
    docker:
      - image: cimg/node:24.19
      - image: postgres:17-alpine
        environment:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
    resource_class: large
    environment:
      NODE_ENV: test
      ENABLE_CURATION: 'false'
      SKIP_TESTCONTAINERS: 'true'
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - skip-unless-integration
      - checkout
      - install-pnpm-deps
      - run:
          name: Refresh integration test impact data
          no_output_timeout: 30m
          command: circleci testsuite run "integration tests" --analyze-tests=impacted --run-tests=none

  dependency-remediation-tests:
    docker:
      - image: cimg/node:24.19
    resource_class: medium
    steps:
      - attach_workspace:
          at: /tmp/.ci-flags
      - run:
          name: Skip if no remediation-path changes
          command: |
            if [ "$(cat /tmp/.ci-flags/remediation 2>/dev/null || echo true)" != "true" ]; then
              echo "No remediation-path changes; skipping."
              circleci-agent step halt
            fi
      - checkout
      - init-env
      - install-pnpm-deps
      - run:
          name: Dependency remediation tests
          command: |
            mkdir -p test-results/dependency-remediation
            node --test \
              --test-reporter=spec \
              --test-reporter-destination=stdout \
              --test-reporter=junit \
              --test-reporter-destination=test-results/dependency-remediation/node.xml \
              .github/scripts/dependency-remediation.test.mjs
            sed \
              -e 's|<testsuites>|<testsuites><testsuite name="dependency-remediation">|' \
              -e 's|</testsuites>|</testsuite></testsuites>|' \
              test-results/dependency-remediation/node.xml > test-results/dependency-remediation/node.xml.tmp
            mv test-results/dependency-remediation/node.xml.tmp test-results/dependency-remediation/node.xml
      - store_test_results:
          path: test-results

workflows:
  # PR merge gate. pull_request events on non-main heads run ci-pr;
  # develop/main push events remain owned by ci-trunk.
  ci-pr:
    when:
      and:
        - equal: [pull_request, << pipeline.event.name >>]
        - equal: [false, << pipeline.event.github.pull_request.draft >>]
        - not:
            equal: [main, << pipeline.git.branch >>]
        - or:
            - equal: [opened, << pipeline.event.action >>]
            - equal: [synchronize, << pipeline.event.action >>]
            - equal: [reopened, << pipeline.event.action >>]
            - equal: [ready_for_review, << pipeline.event.action >>]
    jobs:
      - detect-changes
      - lint-and-type-check:
          requires:
            - detect-changes
      - build:
          requires:
            - detect-changes
      - vulnerability-scan:
          requires:
            - detect-changes
      - unit-tests:
          requires:
            - detect-changes
      - integration-light:
          requires:
            - detect-changes
      - security-tests:
          skip_unless: integration
          requires:
            - detect-changes
      - dependency-remediation-tests:
          requires:
            - detect-changes

  # No merge_group trigger. Codecov and all-checks-trunk omitted: workflow status is the gate.
  ci-trunk:
    when:
      not:
        equal: [pull_request, << pipeline.event.name >>]
    jobs:
      - detect-changes:
          filters:
            branches:
              only: [main, develop]
      - warm-pnpm-cache:
          filters:
            branches:
              only: [main, develop]
      - unit-impact-analysis:
          requires:
            - detect-changes
          filters:
            branches:
              only: develop
      - unit-tests-trunk:
          requires:
            - detect-changes
          filters:
            branches:
              only: develop
      - list-integration-tests:
          requires:
            - detect-changes
          filters:
            branches:
              only: develop
      - integration-tests:
          requires:
            - detect-changes
            - list-integration-tests
          filters:
            branches:
              only: develop
      - integration-impact-analysis:
          requires:
            - detect-changes
          filters:
            branches:
              only: develop
      - security-tests:
          skip_unless: integration
          requires:
            - detect-changes
          filters:
            branches:
              only: [main, develop]

# Experimental (CircleCI says this stanza will be replaced in a future release).
# integration-tests starts between min and max nodes based on the atoms that
# list-integration-tests selected; on any failure it keeps its static parallelism.
experimental:
  dynamic-parallelism:
    integration-tests:
      key: atlaris-integration-parallelism
      min: 1
      max: 2
