version: 2.1

setup: true

parameters:
  base_ref:
    type: string
    default: develop
  integration_workers:
    type: enum
    enum: ['2', '4']
    default: '4'
  test_db_debug:
    type: boolean
    default: false

orbs:
  path-filtering: circleci/path-filtering@1.3.0

workflows:
  setup-pr:
    when:
      and:
        - equal: [pull_request, << pipeline.event.name >>]
        - equal: [false, << pipeline.event.github.pull_request.draft >>]
    jobs:
      - path-filtering/filter:
          name: select-config
          tag: "3.12"
          base-revision: << pipeline.event.github.pull_request.base.ref >>
          config-path: .circleci/no-updates.yml
          # Docs tree, root Markdown, and issue templates are cheap docs CI.
          mapping: &config-mapping |
            .* always-continue true .circleci/shared-config.yml
            (^docs/.*|^[^/]+\.md$|^\.github/ISSUE_TEMPLATE/.*) docs-changed true .circleci/docs-config.yml
            (?!(docs/|[^/]+\.md$|\.github/ISSUE_TEMPLATE/)).* code-changed true .circleci/code-config.yml

  setup-main:
    when:
      and:
        - not:
            equal: [pull_request, << pipeline.event.name >>]
        - equal: [main, << pipeline.git.branch >>]
    jobs:
      - path-filtering/filter:
          name: select-config
          tag: "3.12"
          # Push HEAD vs branch name is empty; compare to the previous SHA.
          base-revision: << pipeline.git.base_revision >>
          config-path: .circleci/no-updates.yml
          mapping: *config-mapping

  setup-develop:
    when:
      and:
        - not:
            equal: [pull_request, << pipeline.event.name >>]
        - equal: [develop, << pipeline.git.branch >>]
    jobs:
      - path-filtering/filter:
          name: select-config
          tag: "3.12"
          # Push HEAD vs develop is empty; compare to the previous SHA.
          base-revision: << pipeline.git.base_revision >>
          config-path: .circleci/no-updates.yml
          mapping: *config-mapping
