version: 2.1

setup: true

parameters:
  base_ref:
    type: string
    default: develop
  integration_workers:
    type: enum
    enum: ['2', '4']
    default: '4'
  test_db_debug:
    type: boolean
    default: false

orbs:
  path-filtering: circleci/path-filtering@1.3.0

workflows:
  setup-pr:
    when:
      equal: [pull_request, << pipeline.event.name >>]
    jobs:
      - path-filtering/filter:
          name: select-config
          tag: "3.12"
          base-revision: << pipeline.event.github.pull_request.base.ref >>
          config-path: .circleci/no-updates.yml
          # Only docs/** is docs-only; root and CI/config changes run code CI.
          mapping: &config-mapping |
            .* always-continue true .circleci/shared-config.yml
            docs/.* docs-changed true .circleci/docs-config.yml
            (?!docs/).* code-changed true .circleci/code-config.yml

  setup-main:
    when:
      and:
        - not:
            equal: [pull_request, << pipeline.event.name >>]
        - equal: [main, << pipeline.git.branch >>]
    jobs:
      - path-filtering/filter:
          name: select-config
          tag: "3.12"
          base-revision: main
          config-path: .circleci/no-updates.yml
          mapping: *config-mapping

  setup-default:
    when:
      and:
        - not:
            equal: [pull_request, << pipeline.event.name >>]
        - not:
            equal: [main, << pipeline.git.branch >>]
    jobs:
      - path-filtering/filter:
          name: select-config
          tag: "3.12"
          base-revision: << pipeline.parameters.base_ref >>
          config-path: .circleci/no-updates.yml
          mapping: *config-mapping
