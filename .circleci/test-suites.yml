---
name: unit tests
# `unit` runs .ts specs in Node and `unit-dom` runs .tsx specs in jsdom
# (see vitest.config.ts); both projects belong to this one suite.
# `pnpm --silent exec`: outside CI, pnpm 11 may auto-install before exec and
# print install chatter to stdout, which `discover` would read as test atoms.
discover: >-
  pnpm --silent exec vitest list --config vitest.config.ts --project unit --project unit-dom --filesOnly tests/unit
  | sed -E 's/^\[[^]]+\] //'
run: >-
  pnpm exec vitest run --config vitest.config.ts --project unit --project unit-dom
  --reporter=default
  --reporter=json
  --reporter=junit
  --outputFile.json=test-results/unit/results.json
  --outputFile.junit="<< outputs.junit >>"
  << test.atoms >>
# Single-pass analysis: @circleci/vitest-circleci-coverage records per-test V8
# coverage for every atom in one Vitest run (enabled by CIRCLECI_COVERAGE in
# vitest.config.ts), instead of one lcov run per atom.
analysis: >-
  CIRCLECI_COVERAGE="<< outputs.circleci-coverage >>"
  pnpm exec vitest run --config vitest.config.ts --project unit --project unit-dom
  << test.atoms >>
outputs:
  junit: test-results/unit/junit.xml
options:
  test-impact-analysis: true
  impact-key: atlaris-unit-tests
  # `**` matches one directory level only here, so list each nested depth.
  full-test-run-paths:
    - .circleci/*
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - tsconfig.json
    - '*.config.*'
    - middleware.ts
    - public/*
    - public/*/*
    - supabase/*
    - supabase/*/*
    - supabase/*/*/*
    - tests/helpers/*
    - tests/helpers/*/*
    - tests/mocks/*/*
    - tests/setup/*
    - tests/unit/setup.ts
    - tests/unit/setup.node.ts
---
name: integration tests
# `pnpm --silent exec`: see the unit suite.
discover: >-
  pnpm --silent exec vitest list --config vitest.config.ts --project integration --filesOnly tests/integration
  | sed -E 's/^\[[^]]+\] //'
run: >-
  pnpm exec vitest run --config vitest.config.ts --project integration
  --coverage
  --coverage.thresholds.lines=0
  --coverage.thresholds.functions=0
  --coverage.thresholds.branches=0
  --coverage.thresholds.statements=0
  --reporter=default
  --reporter=json
  --reporter=junit
  --outputFile.json=test-results/integration/results.json
  --outputFile.junit="<< outputs.junit >>"
  << test.atoms >>
# Single-pass analysis (see the unit suite): one Vitest run covers every atom,
# so the global setup rebuilds the shared template database once and the
# per-atom mkdir lock is no longer needed.
analysis: >-
  CIRCLECI_COVERAGE="<< outputs.circleci-coverage >>"
  pnpm exec vitest run --config vitest.config.ts --project integration
  << test.atoms >>
outputs:
  junit: test-results/integration/junit.xml
options:
  test-impact-analysis: true
  # Splits atoms across nodes where the job sets parallelism > 1 (integration-tests on develop).
  dynamic-test-splitting: true
  store-test-results: true
  impact-key: atlaris-integration-tests
  # `**` matches one directory level only here, so list each nested depth.
  full-test-run-paths:
    - .circleci/*
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - tsconfig.json
    - '*.config.*'
    - middleware.ts
    - supabase/*
    - supabase/*/*
    - supabase/*/*/*
    - tests/fixtures/**
    - tests/integration/**/*-helpers.ts
    - tests/helpers/*
    - tests/helpers/*/*
    - tests/mocks/*/*
    - tests/setup/*
