name: Deploy Migrations to Production

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Migration phase to apply
        required: true
        type: choice
        options:
          - expand
          - contract
      confirm_contract:
        description: Type post-deploy-health-verified for the contract phase
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-db-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Push Supabase migrations to production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production – atlaris

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.98.1

      - name: Print Supabase CLI version
        run: supabase --version

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply selected migration phase
        env:
          MIGRATION_PHASE: ${{ inputs.phase }}
          CONTRACT_CONFIRMATION: ${{ inputs.confirm_contract }}
        shell: bash
        run: bash scripts/db/run-phased-migrations.sh
