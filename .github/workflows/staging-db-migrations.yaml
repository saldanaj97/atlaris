name: Deploy Migrations to Staging
run-name: Staging migrations (${{ inputs.phase }}) @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Migration phase to apply
        required: true
        type: choice
        options:
          - expand
          - contract
      confirm_contract:
        description: Type post-deploy-health-verified for the contract phase
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: staging-db-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Push Supabase migrations to staging
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.STAGING_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.98.1

      - name: Print Supabase CLI version
        run: supabase --version

      - name: Link staging project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply selected migration phase
        env:
          MIGRATION_PHASE: ${{ inputs.phase }}
          CONTRACT_CONFIRMATION: ${{ inputs.confirm_contract }}
        shell: bash
        run: bash scripts/db/run-phased-migrations.sh
