name: Vercel deployment lanes (proof phase)

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      lane:
        description: Manual lane (Production is never available here)
        required: true
        type: choice
        options:
          - preview
          - staging
      commit_sha:
        description: Exact 40-character commit SHA to deploy
        required: true
        type: string
      git_branch:
        description: Branch that must contain commit_sha (Preview metadata; Staging must be develop)
        required: true
        type: string
      force_deploy:
        description: Force deployment when the diff cannot be classified
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deployment-decision:
    name: deployment-decision
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy: ${{ steps.decision.outputs.deploy }}
      reason: ${{ steps.decision.outputs.reason }}
      source_sha: ${{ steps.decision.outputs.source_sha }}
      candidate_sha: ${{ steps.decision.outputs.candidate_sha }}
      same_repository_pr: ${{ steps.decision.outputs.same_repository_pr }}
      fork_guard: ${{ steps.decision.outputs.fork_guard }}
      secret_deploy_eligible: ${{ steps.decision.outputs.secret_deploy_eligible }}
      staging_auto_eligible: ${{ steps.decision.outputs.staging_auto_eligible }}
      decision_error: ${{ steps.decision.outputs.decision_error }}
      decision_error_reason: ${{ steps.decision.outputs.decision_error_reason }}
    steps:
      - name: Check out candidate source
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Report deployment decision
        id: decision
        if: always()
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_BASE_REF_FROM: ${{ github.event.changes.base.ref.from }}
          PR_BASE_SHA_FROM: ${{ github.event.changes.base.sha.from }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          MANUAL_COMMIT_SHA: ${{ inputs.commit_sha }}
          MANUAL_GIT_BRANCH: ${{ inputs.git_branch }}
          MANUAL_LANE: ${{ inputs.lane }}
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
        run: |
          set -uo pipefail

          deploy=true
          reason='unknown diff'
          source_sha=''
          candidate_sha=''
          same_repository_pr='not-applicable'
          manual_ref_trusted='not-applicable'
          fork_guard='not-applicable'
          secret_deploy_eligible=false
          staging_auto_eligible=false
          decision_error=false
          decision_error_reason=''
          changed_files=''
          checkout_sha=''
          zero_sha='0000000000000000000000000000000000000000'
          pr_base_changed=false

          is_sha() {
            [[ "${1:-}" =~ ^[0-9a-f]{40}$ && "${1}" != "${zero_sha}" ]]
          }

          set_error() {
            decision_error=true
            decision_error_reason="${1}"
            deploy=false
            reason="${1}"
            secret_deploy_eligible=false
            staging_auto_eligible=false
          }

          if [[ "${EVENT_NAME:-}" == 'pull_request' && "${EVENT_ACTION:-}" == 'edited' &&
            ( -n "${PR_BASE_REF_FROM:-}" || -n "${PR_BASE_SHA_FROM:-}" ) ]]; then
            pr_base_changed=true
          fi

          if [[ "${EVENT_NAME:-}" == 'pull_request' ]]; then
            same_repository_pr='false'
            fork_guard='ineligible'
            if [[ -n "${HEAD_REPOSITORY:-}" && "${HEAD_REPOSITORY}" == "${GITHUB_REPOSITORY}" ]]; then
              same_repository_pr='true'
              if [[ "${PR_AUTHOR:-}" == 'dependabot[bot]' ]]; then
                fork_guard='dependabot-secrets-unavailable'
              else
                fork_guard='eligible'
              fi
            fi
          fi

          if changed_files="$(mktemp)"; then
            cleanup() {
              [[ -z "${changed_files}" ]] || rm -f -- "${changed_files}"
            }
            trap cleanup EXIT
          else
            changed_files=''
          fi

          classify() {
            local result deploy_value reason_value

            [[ -n "${changed_files}" && -f "${changed_files}" ]] || return 1
            [[ -f .github/scripts/deployment-classifier.mjs ]] || return 1
            result="$(node .github/scripts/deployment-classifier.mjs \
              --changed-files "${changed_files}" "${force_args[@]}" 2>/dev/null)" || return 1
            deploy_value="$(sed -n 's/^deploy=//p' <<<"${result}")"
            reason_value="$(sed -n 's/^reason=//p' <<<"${result}")"

            case "${deploy_value}" in
              true|false) ;;
              *) return 1 ;;
            esac
            case "${reason_value}" in
              'docs-only'|'deploy-impacting path'|'unknown diff'|'forced') ;;
              *) return 1 ;;
            esac

            deploy="${deploy_value}"
            reason="${reason_value}"
          }

          manual_request_trusted() {
            [[ "${GITHUB_REF:-}" == 'refs/heads/develop' ]] || return 1
            is_sha "${MANUAL_COMMIT_SHA:-}" || return 1
            is_sha "${checkout_sha}" || return 1
            [[ "${checkout_sha}" == "${MANUAL_COMMIT_SHA}" ]] || return 1
            git check-ref-format --branch -- "${MANUAL_GIT_BRANCH:-}" >/dev/null 2>&1 || return 1
            git fetch --no-tags origin \
              "refs/heads/${MANUAL_GIT_BRANCH}:refs/remotes/origin/${MANUAL_GIT_BRANCH}" \
              >/dev/null 2>&1 || return 1
            git merge-base --is-ancestor \
              "${MANUAL_COMMIT_SHA}" \
              "refs/remotes/origin/${MANUAL_GIT_BRANCH}" || return 1
            case "${MANUAL_LANE:-}" in
              preview)
                return 0
                ;;
              staging)
                [[ "${MANUAL_GIT_BRANCH}" == 'develop' ]] || return 1
                [[ "${MANUAL_COMMIT_SHA}" == "${GITHUB_SHA:-}" ]] || return 1
                ;;
              *)
                return 1
                ;;
            esac
          }

          force_args=()
          if [[ "${FORCE_DEPLOY:-false}" == 'true' ]]; then
            force_args=(--force-deploy)
          fi

          if [[ "${EVENT_NAME:-}" == 'pull_request' && "${EVENT_ACTION:-}" == 'edited' &&
            "${pr_base_changed}" != 'true' ]]; then
            deploy=false
            reason='non-base PR edit'
            if is_sha "${HEAD_SHA:-}"; then
              source_sha="${HEAD_SHA}"
              candidate_sha="${HEAD_SHA}"
            fi
          elif [[ "${CHECKOUT_OUTCOME:-}" == 'success' ]] && git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            checkout_sha="$(git rev-parse HEAD 2>/dev/null || true)"

            case "${EVENT_NAME:-}" in
              pull_request)
                if ! is_sha "${checkout_sha}"; then
                  set_error 'unable to produce valid source/candidate'
                elif ! is_sha "${HEAD_SHA:-}"; then
                  set_error 'unable to produce valid source/candidate'
                elif [[ "${checkout_sha}" != "${HEAD_SHA}" ]]; then
                  set_error 'event SHA mismatch'
                elif ! is_sha "${BASE_SHA:-}" ||
                  [[ "${BASE_REF:-}" != 'develop' && "${BASE_REF:-}" != 'main' ]] ||
                  ! git fetch --no-tags origin \
                    "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" >/dev/null 2>&1 ||
                  ! git cat-file -e "${BASE_SHA}^{commit}" >/dev/null 2>&1 ||
                  ! merge_base="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}" 2>/dev/null)" ||
                  ! is_sha "${merge_base}" ||
                  ! git diff --no-renames --name-only "${merge_base}...${HEAD_SHA}" >"${changed_files}"; then
                  set_error 'trusted base fetch/resolve failure'
                else
                  source_sha="${HEAD_SHA}"
                  candidate_sha="${HEAD_SHA}"
                  classify || true
                fi
                ;;
              push)
                if ! is_sha "${checkout_sha}"; then
                  set_error 'unable to produce valid source/candidate'
                elif ! is_sha "${PUSH_AFTER:-}"; then
                  set_error 'unable to produce valid source/candidate'
                elif [[ "${checkout_sha}" != "${PUSH_AFTER}" ]]; then
                  set_error 'event SHA mismatch'
                else
                  source_sha="${PUSH_AFTER}"
                  candidate_sha="${PUSH_AFTER}"
                  if is_sha "${PUSH_BEFORE:-}" &&
                    git cat-file -e "${PUSH_BEFORE}^{commit}" >/dev/null 2>&1 &&
                    git cat-file -e "${PUSH_AFTER}^{commit}" >/dev/null 2>&1 &&
                    git diff --no-renames --name-only "${PUSH_BEFORE}..${PUSH_AFTER}" >"${changed_files}"; then
                    classify || true
                  else
                    classify || true
                  fi
                fi
                ;;
              workflow_dispatch)
                manual_ref_trusted='false'
                if manual_request_trusted; then
                  manual_ref_trusted='true'
                  source_sha="${MANUAL_COMMIT_SHA}"
                  candidate_sha="${MANUAL_COMMIT_SHA}"
                  classify || true
                else
                  set_error 'stale or invalid manual request'
                fi
                ;;
              *)
                set_error 'unable to produce valid source/candidate'
                ;;
            esac
          else
            if [[ "${EVENT_NAME:-}" == 'workflow_dispatch' ]]; then
              set_error 'stale or invalid manual request'
            else
              set_error 'automated checkout failure'
            fi
          fi

          if [[ "${pr_base_changed}" == 'true' ]]; then
            set_error 'PR base changed'
          fi

          if [[ "${decision_error}" != 'true' &&
            "${EVENT_NAME:-}" == 'push' && "${GITHUB_REF:-}" == 'refs/heads/develop' &&
            "${deploy}" == 'true' &&
            "${reason}" != 'unknown diff' && -n "${changed_files}" && -f "${changed_files}" ]] &&
            git fetch --no-tags origin \
              '+refs/heads/main:refs/remotes/origin/main' >/dev/null 2>&1 &&
            staging_base="$(git merge-base refs/remotes/origin/main "${PUSH_AFTER}" 2>/dev/null)" &&
            is_sha "${staging_base}" &&
            git diff --no-renames --name-only \
              "${staging_base}...${PUSH_AFTER}" >"${changed_files}" &&
            ! grep -q '^supabase/migrations/' "${changed_files}"; then
            staging_auto_eligible=true
          fi

          if [[ "${decision_error}" != 'true' ]]; then
            case "${EVENT_NAME:-}" in
              pull_request)
                if [[ "${fork_guard}" == 'eligible' ]] &&
                  [[ "${PR_DRAFT:-false}" != 'true' ]] &&
                  is_sha "${source_sha}" && is_sha "${candidate_sha}"; then
                  secret_deploy_eligible=true
                fi
                ;;
              push)
                if is_sha "${source_sha}" && is_sha "${candidate_sha}"; then
                  secret_deploy_eligible=true
                fi
                ;;
              workflow_dispatch)
                manual_lane_eligible=false
                if [[ "${MANUAL_LANE:-}" == 'preview' ]]; then
                  manual_lane_eligible=true
                elif [[ "${MANUAL_LANE:-}" == 'staging' &&
                  "${GITHUB_REF:-}" == 'refs/heads/develop' &&
                  "${MANUAL_GIT_BRANCH:-}" == 'develop' &&
                  "${candidate_sha}" == "${GITHUB_SHA:-}" ]]; then
                  manual_lane_eligible=true
                fi
                if [[ "${manual_lane_eligible}" == 'true' ]] &&
                  [[ "${manual_ref_trusted}" == 'true' ]] &&
                  is_sha "${source_sha}" && is_sha "${candidate_sha}"; then
                  secret_deploy_eligible=true
                else
                  fork_guard='manual-lane-or-ref-ineligible'
                  set_error 'stale or invalid manual request'
                fi
                ;;
            esac
          fi

          summary_ref="${GITHUB_REF:-unknown}"
          if [[ "${EVENT_NAME:-}" == 'pull_request' ]]; then
            summary_ref="${BASE_REF:-unknown} <- ${HEAD_REF:-unknown}"
          elif [[ "${EVENT_NAME:-}" == 'workflow_dispatch' ]]; then
            summary_ref="${MANUAL_GIT_BRANCH:-unknown}@${MANUAL_COMMIT_SHA:-unknown}"
          fi
          summary_ref="${summary_ref//$'\r'/ }"
          summary_ref="${summary_ref//$'\n'/ }"
          summary_ref="${summary_ref//|/\\|}"
          manual_lane="${MANUAL_LANE:-not-applicable}"
          manual_lane="${manual_lane//$'\r'/ }"
          manual_lane="${manual_lane//$'\n'/ }"
          manual_lane="${manual_lane//|/\\|}"

          {
            printf 'deploy=%s\n' "${deploy}"
            printf 'reason=%s\n' "${reason}"
            printf 'source_sha=%s\n' "${source_sha}"
            printf 'candidate_sha=%s\n' "${candidate_sha}"
            printf 'same_repository_pr=%s\n' "${same_repository_pr}"
            printf 'fork_guard=%s\n' "${fork_guard}"
            printf 'secret_deploy_eligible=%s\n' "${secret_deploy_eligible}"
            printf 'staging_auto_eligible=%s\n' "${staging_auto_eligible}"
            printf 'decision_error=%s\n' "${decision_error}"
            printf 'decision_error_reason=%s\n' "${decision_error_reason}"
          } >>"${GITHUB_OUTPUT}"

          {
            echo '## Vercel deployment decision'
            echo
            echo 'The decision job always reports. Deployment lanes run only for eligible, deploy-impacting candidates.'
            echo
            echo '| Field | Value |'
            echo '| --- | --- |'
            echo "| Event | ${EVENT_NAME:-unknown} |"
            echo "| Ref | ${summary_ref} |"
            echo "| Manual lane | ${manual_lane} |"
            echo "| Source SHA | ${source_sha:-unknown} |"
            echo "| Candidate SHA | ${candidate_sha:-unknown} |"
            echo "| Deploy | ${deploy} |"
            echo "| Reason | ${reason} |"
            echo "| Decision error | ${decision_error} |"
            echo "| Decision error reason | ${decision_error_reason:-none} |"
            echo "| Same-repository PR | ${same_repository_pr} |"
            echo "| Trusted manual ref | ${manual_ref_trusted} |"
            echo "| Fork guard | ${fork_guard} |"
            echo "| Secret-backed deploy eligible | ${secret_deploy_eligible} |"
            echo "| Automatic Staging eligible | ${staging_auto_eligible} |"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Fail on decision error
        if: always() && steps.decision.outputs.decision_error == 'true'
        env:
          DECISION_ERROR_REASON: ${{ steps.decision.outputs.decision_error_reason }}
        run: |
          set -euo pipefail
          echo "::error::${DECISION_ERROR_REASON}"
          exit 1

  preview:
    name: Preview deployment
    needs: deployment-decision
    if: >-
      needs.deployment-decision.outputs.deploy == 'true' &&
      needs.deployment-decision.outputs.secret_deploy_eligible == 'true' &&
      (
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'workflow_dispatch' && inputs.lane == 'preview')
      )
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-preview-${{ github.event.pull_request.number || inputs.commit_sha || github.run_id }}
      cancel-in-progress: false
    timeout-minutes: 40
    outputs:
      deployment_id: ${{ steps.inspect.outputs.id }}
      deployment_url: ${{ steps.inspect.outputs.url }}
      deployment_status: ${{ steps.inspect.outputs.status }}
      deployment_target: ${{ steps.inspect.outputs.target }}
      candidate_sha: ${{ steps.inspect.outputs.sha }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.deployment-decision.outputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: '24'

      - name: Install Vercel CLI
        run: npm install --global vercel@53.2.0 >/dev/null

      - name: Deploy Preview candidate
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GIT_PROVIDER: github
          VERCEL_GIT_REPO_OWNER: ${{ github.repository_owner }}
          VERCEL_GIT_REPO_SLUG: ${{ github.event.repository.name }}
          VERCEL_GIT_COMMIT_SHA: ${{ needs.deployment-decision.outputs.candidate_sha }}
          GITHUB_COMMIT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || inputs.git_branch }}
          EXPECTED_SHA: ${{ needs.deployment-decision.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          deployment_url="$(
            vercel deploy --no-wait --yes \
              --meta githubDeployment=1 \
              --meta "githubOrg=${GITHUB_REPOSITORY_OWNER}" \
              --meta "githubRepo=${GITHUB_REPOSITORY#*/}" \
              --meta "githubCommitOrg=${GITHUB_REPOSITORY_OWNER}" \
              --meta "githubCommitRepo=${GITHUB_REPOSITORY#*/}" \
              --meta "githubCommitRef=${GITHUB_COMMIT_REF}" \
              --meta "githubCommitSha=${EXPECTED_SHA}"
          )"
          test -n "${deployment_url}"
          printf 'url=%s\n' "${deployment_url}" >>"${GITHUB_OUTPUT}"

      - name: Inspect Preview deployment
        id: inspect
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          EXPECTED_SHA: ${{ needs.deployment-decision.outputs.candidate_sha }}
          EXPECTED_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || inputs.git_branch }}
        run: |
          set -euo pipefail
          vercel inspect "${DEPLOYMENT_URL}" --wait --timeout 25m --format=json >inspection.json
          deployment_id="$(jq -er '.id | select(type == "string" and length > 0)' inspection.json)"
          deployment_url="$(jq -er '.url | select(type == "string" and length > 0)' inspection.json)"
          ready_state="$(jq -er '.readyState | select(. == "READY")' inspection.json)"
          target="$(jq -er '.target | select(. == "preview")' inspection.json)"
          source_sha="$(git rev-parse HEAD)"
          aliases="$(jq -cer '(.alias // .aliases // []) | select(type == "array")' inspection.json)"
          test "${source_sha}" = "${EXPECTED_SHA}"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header "Accept: application/json" \
            --output deployment-api.json \
            "https://api.vercel.com/v13/deployments/${deployment_id}?teamId=${VERCEL_ORG_ID}"
          jq -e --arg sha "${EXPECTED_SHA}" --arg ref "${EXPECTED_REF}" \
            '.meta.githubDeployment == "1" and .meta.githubCommitSha == $sha and .meta.githubCommitRef == $ref' \
            deployment-api.json >/dev/null
          printf 'id=%s\nurl=%s\nstatus=%s\ntarget=%s\nsha=%s\n' \
            "${deployment_id}" "${deployment_url}" "${ready_state}" "${target}" "${source_sha}" >>"${GITHUB_OUTPUT}"
          {
            echo '## Vercel Preview deployment'
            echo
            echo '| Field | Value |'
            echo '| --- | --- |'
            echo "| URL | ${deployment_url} |"
            echo "| Deployment ID | ${deployment_id} |"
            echo "| Status | ${ready_state} |"
            echo "| Target | ${target} |"
            echo "| Exact SHA | ${source_sha} |"
            echo "| Requested ref | ${EXPECTED_REF} |"
            echo "| Aliases | ${aliases} |"
            echo
            echo 'This is a custom-CI Preview deployment.'
          } >>"${GITHUB_STEP_SUMMARY}"

  staging:
    name: Develop Staging Preview deployment
    needs: deployment-decision
    if: >-
      needs.deployment-decision.outputs.deploy == 'true' &&
      needs.deployment-decision.outputs.secret_deploy_eligible == 'true' &&
      (
        (github.event_name == 'push' &&
          github.ref == 'refs/heads/develop' &&
          needs.deployment-decision.outputs.staging_auto_eligible == 'true') ||
        (github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/develop' &&
          needs.deployment-decision.outputs.candidate_sha == github.sha &&
          inputs.lane == 'staging')
      )
    permissions:
      actions: read
      checks: read
      contents: read
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: vercel-staging-develop
      cancel-in-progress: false
    timeout-minutes: 75
    outputs:
      deployment_id: ${{ steps.inspect.outputs.id }}
      deployment_url: ${{ steps.inspect.outputs.url }}
      deployment_status: ${{ steps.inspect.outputs.status }}
      deployment_target: ${{ steps.inspect.outputs.target }}
      candidate_sha: ${{ steps.inspect.outputs.sha }}
    env:
      VERCEL_GIT_PROVIDER: github
      VERCEL_GIT_REPO_OWNER: ${{ github.repository_owner }}
      VERCEL_GIT_REPO_SLUG: ${{ github.event.repository.name }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.deployment-decision.outputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify successful same-SHA Staging expand
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.deployment-decision.outputs.candidate_sha }}
        run: |
          set -euo pipefail

          expected_title="Staging migrations (expand) @ ${EXPECTED_SHA}"
          workflow_runs="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/staging-db-migrations.yaml/runs" \
              -f branch='develop' \
              -f event='workflow_dispatch' \
              -f status='success' \
              -f head_sha="${EXPECTED_SHA}" \
              -F per_page=100
          )"

          if ! jq -e \
            --arg expected_sha "${EXPECTED_SHA}" \
            --arg expected_title "${expected_title}" \
            '[.workflow_runs[] | select(
              .event == "workflow_dispatch" and
              .status == "completed" and
              .conclusion == "success" and
              .head_branch == "develop" and
              .head_sha == $expected_sha and
              .display_title == $expected_title
            )] | length > 0' \
            <<<"${workflow_runs}" >/dev/null; then
            echo "No successful Staging expand run matches ${EXPECTED_SHA}." >&2
            exit 1
          fi

      - name: Wait for same-SHA CircleCI trunk success
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.deployment-decision.outputs.candidate_sha }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 80); do
            check_run_pages="$(
              gh api --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_SHA}/check-runs?filter=all&per_page=100" \
                2>/dev/null || true
            )"
            [[ -n "${check_run_pages}" ]] || check_run_pages='[]'
            check_run="$(
              jq -c '[.[].check_runs[] | select(
                .app.slug == "circleci-checks" and
                (.name | startswith("ci-trunk - "))
              )] | max_by(.id) // {}' <<<"${check_run_pages}" 2>/dev/null || true
            )"
            [[ -n "${check_run}" ]] || check_run='{}'
            status="$(jq -r '.status // "missing"' <<<"${check_run}")"
            conclusion="$(jq -r '.conclusion // "pending"' <<<"${check_run}")"

            if [[ "${status}" == 'completed' ]]; then
              if [[ "${conclusion}" == 'success' ]]; then
                echo "CircleCI ci-trunk passed for ${EXPECTED_SHA}."
                exit 0
              fi
              echo "CircleCI ci-trunk completed with ${conclusion} for ${EXPECTED_SHA}." >&2
              exit 1
            fi

            if [[ "${status}" == 'queued' || "${status}" == 'in_progress' ]]; then
              echo "CircleCI ci-trunk is ${status} for ${EXPECTED_SHA}."
            fi

            if [[ "${attempt}" -eq 80 ]]; then
              echo "Timed out waiting for CircleCI ci-trunk on ${EXPECTED_SHA}." >&2
              exit 1
            fi
            sleep 15
          done

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: '24'

      - name: Install Vercel CLI
        run: npm install --global vercel@53.2.0 >/dev/null

      - name: Deploy develop Preview artifact
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GIT_COMMIT_SHA: ${{ needs.deployment-decision.outputs.candidate_sha }}
          GITHUB_COMMIT_REF: develop
          EXPECTED_SHA: ${{ needs.deployment-decision.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          deployment_url="$(
            vercel deploy --no-wait --yes \
              --meta githubDeployment=1 \
              --meta "githubOrg=${GITHUB_REPOSITORY_OWNER}" \
              --meta "githubRepo=${GITHUB_REPOSITORY#*/}" \
              --meta "githubCommitOrg=${GITHUB_REPOSITORY_OWNER}" \
              --meta "githubCommitRepo=${GITHUB_REPOSITORY#*/}" \
              --meta "githubCommitRef=${GITHUB_COMMIT_REF}" \
              --meta "githubCommitSha=${EXPECTED_SHA}"
          )"
          test -n "${deployment_url}"
          printf 'url=%s\n' "${deployment_url}" >>"${GITHUB_OUTPUT}"

      - name: Inspect develop Preview deployment
        id: inspect
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          EXPECTED_SHA: ${{ needs.deployment-decision.outputs.candidate_sha }}
          EXPECTED_REF: develop
        run: |
          set -euo pipefail
          vercel inspect "${DEPLOYMENT_URL}" --wait --timeout 25m --format=json >inspection.json
          deployment_id="$(jq -er '.id | select(type == "string" and length > 0)' inspection.json)"
          deployment_url="$(jq -er '.url | select(type == "string" and length > 0)' inspection.json)"
          ready_state="$(jq -er '.readyState | select(. == "READY")' inspection.json)"
          target="$(jq -er '.target | select(. == "preview")' inspection.json)"
          source_sha="$(git rev-parse HEAD)"
          aliases="$(jq -cer '(.alias // .aliases // []) | select(type == "array")' inspection.json)"
          test "${source_sha}" = "${EXPECTED_SHA}"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header "Accept: application/json" \
            --output deployment-api.json \
            "https://api.vercel.com/v13/deployments/${deployment_id}?teamId=${VERCEL_ORG_ID}"
          jq -e --arg sha "${EXPECTED_SHA}" --arg ref "${EXPECTED_REF}" \
            '.meta.githubDeployment == "1" and .meta.githubCommitSha == $sha and .meta.githubCommitRef == $ref' \
            deployment-api.json >/dev/null
          printf 'id=%s\nurl=%s\nstatus=%s\ntarget=%s\nsha=%s\n' \
            "${deployment_id}" "${deployment_url}" "${ready_state}" "${target}" "${source_sha}" >>"${GITHUB_OUTPUT}"
          {
            echo '## Vercel develop Staging Preview deployment'
            echo
            echo '| Field | Value |'
            echo '| --- | --- |'
            echo "| URL | ${deployment_url} |"
            echo "| Deployment ID | ${deployment_id} |"
            echo "| Status | ${ready_state} |"
            echo "| Target | ${target} |"
            echo "| Exact SHA | ${source_sha} |"
            echo '| Lane ref | develop |'
            echo "| Aliases | ${aliases} |"
            echo
            echo 'Hobby fallback: this lane uses the default Vercel Preview environment scoped to develop, never Production or a Production domain.'
          } >>"${GITHUB_STEP_SUMMARY}"

  production-candidate:
    name: Production candidate
    needs: deployment-decision
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.VERCEL_NATIVE_GIT_DISABLED == 'true' &&
      vars.VERCEL_DEPLOYMENT_CHECKS_READY == 'true' &&
      needs.deployment-decision.outputs.deploy == 'true' &&
      needs.deployment-decision.outputs.secret_deploy_eligible == 'true'
    permissions:
      actions: read
      checks: read
      contents: read
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-production-main
      cancel-in-progress: false
    timeout-minutes: 75
    outputs:
      deployment_id: ${{ steps.inspect.outputs.id }}
      deployment_url: ${{ steps.inspect.outputs.url }}
      deployment_status: ${{ steps.inspect.outputs.status }}
      deployment_target: ${{ steps.inspect.outputs.target }}
      candidate_sha: ${{ steps.inspect.outputs.sha }}
      aliases: ${{ steps.inspect.outputs.aliases }}
    env:
      VERCEL_GIT_PROVIDER: github
      VERCEL_GIT_REPO_OWNER: ${{ github.repository_owner }}
      VERCEL_GIT_REPO_SLUG: ${{ github.event.repository.name }}
    steps:
      - name: Check out exact main candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.deployment-decision.outputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify a successful Production expand covers the candidate
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.deployment-decision.outputs.candidate_sha }}
        run: |
          set -euo pipefail

          workflow_pages="$(
            gh api --paginate --slurp --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/production-db-migrations.yaml/runs" \
              -f branch='main' \
              -f event='workflow_dispatch' \
              -f status='success' \
              -F per_page=100
          )"

          covering_expand_sha=''
          while IFS= read -r expand_sha; do
            [[ "${expand_sha}" =~ ^[0-9a-f]{40}$ ]] || continue
            git cat-file -e "${expand_sha}^{commit}" >/dev/null 2>&1 || continue
            git merge-base --is-ancestor "${expand_sha}" "${EXPECTED_SHA}" || continue
            candidate_changes="$(git diff --no-renames --name-only "${expand_sha}..${EXPECTED_SHA}")"
            if ! grep -q '^supabase/migrations/' <<<"${candidate_changes}"; then
              covering_expand_sha="${expand_sha}"
              break
            fi
          done < <(
            jq -r '
              [.[]?.workflow_runs[]? | select(
                .event == "workflow_dispatch" and
                .status == "completed" and
                .conclusion == "success" and
                .head_branch == "main" and
                (.head_sha | type == "string") and
                .display_title == ("Production migrations (expand) @ " + .head_sha)
              )]
              | sort_by(.run_started_at)
              | reverse
              | .[].head_sha
            ' <<<"${workflow_pages}"
          )

          if [[ -z "${covering_expand_sha}" ]]; then
            echo "No successful Production expand run covers ${EXPECTED_SHA}." >&2
            exit 1
          fi
          echo "Production expand ${covering_expand_sha} covers ${EXPECTED_SHA}."

      - name: Wait for same-SHA CircleCI trunk success
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.deployment-decision.outputs.candidate_sha }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 80); do
            check_run_pages="$(
              gh api --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_SHA}/check-runs?filter=all&per_page=100" \
                2>/dev/null || true
            )"
            [[ -n "${check_run_pages}" ]] || check_run_pages='[]'
            check_run="$(
              jq -c '[.[].check_runs[] | select(
                .app.slug == "circleci-checks" and
                (.name | startswith("ci-trunk - "))
              )] | max_by(.id) // {}' <<<"${check_run_pages}" 2>/dev/null || true
            )"
            [[ -n "${check_run}" ]] || check_run='{}'
            status="$(jq -r '.status // "missing"' <<<"${check_run}")"
            conclusion="$(jq -r '.conclusion // "pending"' <<<"${check_run}")"

            if [[ "${status}" == 'completed' ]]; then
              if [[ "${conclusion}" == 'success' ]]; then
                echo "CircleCI ci-trunk passed for ${EXPECTED_SHA}."
                exit 0
              fi
              echo "CircleCI ci-trunk completed with ${conclusion} for ${EXPECTED_SHA}." >&2
              exit 1
            fi

            if [[ "${status}" == 'queued' || "${status}" == 'in_progress' ]]; then
              echo "CircleCI ci-trunk is ${status} for ${EXPECTED_SHA}."
            fi

            if [[ "${attempt}" -eq 80 ]]; then
              echo "Timed out waiting for CircleCI ci-trunk on ${EXPECTED_SHA}." >&2
              exit 1
            fi
            sleep 15
          done

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: '24'

      - name: Install Vercel CLI
        run: npm install --global vercel@53.2.0 >/dev/null

      - name: Deploy gated Production candidate
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GIT_COMMIT_SHA: ${{ needs.deployment-decision.outputs.candidate_sha }}
          GITHUB_COMMIT_REF: main
          EXPECTED_SHA: ${{ needs.deployment-decision.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          deployment_url="$(
            vercel deploy --prod --no-wait --yes \
              --meta githubDeployment=1 \
              --meta "githubOrg=${GITHUB_REPOSITORY_OWNER}" \
              --meta "githubRepo=${GITHUB_REPOSITORY#*/}" \
              --meta "githubCommitOrg=${GITHUB_REPOSITORY_OWNER}" \
              --meta "githubCommitRepo=${GITHUB_REPOSITORY#*/}" \
              --meta "githubCommitRef=${GITHUB_COMMIT_REF}" \
              --meta "githubCommitSha=${EXPECTED_SHA}"
          )"
          test -n "${deployment_url}"
          printf 'url=%s\n' "${deployment_url}" >>"${GITHUB_OUTPUT}"

      - name: Inspect Production candidate
        id: inspect
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          EXPECTED_SHA: ${{ needs.deployment-decision.outputs.candidate_sha }}
          EXPECTED_REF: main
        run: |
          set -euo pipefail
          vercel inspect "${DEPLOYMENT_URL}" --wait --timeout 25m --format=json >inspection.json
          deployment_id="$(jq -er '.id | select(type == "string" and length > 0)' inspection.json)"
          deployment_url="$(jq -er '.url | select(type == "string" and length > 0)' inspection.json)"
          ready_state="$(jq -er '.readyState | select(. == "READY")' inspection.json)"
          target="$(jq -er '.target | select(. == "production")' inspection.json)"
          source_sha="$(git rev-parse HEAD)"
          aliases="$(jq -cer '(.alias // .aliases // []) | select(type == "array")' inspection.json)"
          test "${source_sha}" = "${EXPECTED_SHA}"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            --header "Accept: application/json" \
            --output deployment-api.json \
            "https://api.vercel.com/v13/deployments/${deployment_id}?teamId=${VERCEL_ORG_ID}"
          jq -e --arg sha "${EXPECTED_SHA}" --arg ref "${EXPECTED_REF}" \
            '.meta.githubDeployment == "1" and .meta.githubCommitSha == $sha and .meta.githubCommitRef == $ref' \
            deployment-api.json >/dev/null
          printf 'id=%s\nurl=%s\nstatus=%s\ntarget=%s\nsha=%s\naliases=%s\n' \
            "${deployment_id}" "${deployment_url}" "${ready_state}" "${target}" "${source_sha}" "${aliases}" >>"${GITHUB_OUTPUT}"
          {
            echo '## Vercel Production candidate'
            echo
            echo '| Field | Value |'
            echo '| --- | --- |'
            echo "| Generated URL | ${deployment_url} |"
            echo "| Deployment ID | ${deployment_id} |"
            echo "| Status | ${ready_state} |"
            echo "| Target | ${target} |"
            echo "| Exact SHA | ${source_sha} |"
            echo '| Lane ref | main |'
            echo "| Candidate aliases | ${aliases} |"
            echo '| Domain movement | blocked until required Vercel Deployment Checks pass |'
            echo
            echo 'This job runs only after native Git is disabled and JCS-52 Deployment Checks are ready.'
            echo 'It never calls promote, alias, or rollback; Vercel assigns Production domains only after every required check passes.'
          } >>"${GITHUB_STEP_SUMMARY}"
