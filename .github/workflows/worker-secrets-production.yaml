name: Sync Production Worker Secrets
run-name: Production Worker secrets (${{ inputs.mode }}) @ ${{ github.sha }}

# Pushes the 1Password Environment `atlaris-worker-production` to the
# `atlaris-jobs-production` Worker (docs/development/secrets-sync.md).
# Secrets only: Workers Builds still deploys the code.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run lists changes; apply writes them
        required: true
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: read

concurrency:
  group: worker-secrets-production
  cancel-in-progress: false

jobs:
  validate-dispatch:
    name: Validate dispatch branch
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        env:
          DISPATCH_REF: ${{ github.ref }}
          EXPECTED_REF: refs/heads/main
        run: |
          if [[ "$DISPATCH_REF" != "$EXPECTED_REF" ]]; then
            printf 'Production Worker secrets must be synced from %s (got %s).\n' \
              "$EXPECTED_REF" "$DISPATCH_REF" >&2
            exit 1
          fi

  sync:
    name: Sync secrets to atlaris-jobs-production
    needs: validate-dispatch
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment: Production – atlaris

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pnpm 11.9.0
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.9.0

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies without scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      # `op environment read` needs CLI 2.33.0-beta.02 or later.
      - name: Install 1Password CLI
        uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0
        with:
          version: latest-beta

      - name: Sync (${{ inputs.mode }})
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MODE: ${{ inputs.mode }}
        run: |
          if [[ "$MODE" == "apply" ]]; then
            pnpm secrets:sync cloudflare production --yes
          else
            pnpm secrets:sync cloudflare production --dry-run
          fi
